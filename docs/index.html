<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000);
    padding-bottom: 80px;
  }

  /* ── Screens ── */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ── Header ── */
  header {
    position: sticky;
    top: 0;
    background: var(--tg-theme-bg-color, #fff);
    border-bottom: 1px solid var(--tg-theme-hint-color, #ccc);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  #cart-badge {
    background: var(--tg-theme-button-color, #0088cc);
    color: var(--tg-theme-button-text-color, #fff);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: none;
  }

  /* ── Category tabs ── */
  #category-tabs {
    display: flex;
    overflow-x: auto;
    gap: 8px;
    padding: 10px 16px;
    scrollbar-width: none;
  }
  #category-tabs::-webkit-scrollbar { display: none; }
  .tab {
    white-space: nowrap;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--tg-theme-hint-color, #ccc);
    background: transparent;
    color: var(--tg-theme-text-color, #000);
    font-size: 14px;
    cursor: pointer;
  }
  .tab.active {
    background: var(--tg-theme-button-color, #0088cc);
    color: var(--tg-theme-button-text-color, #fff);
    border-color: transparent;
  }

  /* ── Product grid ── */
  #product-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 12px 16px;
  }
  .product-card {
    border-radius: 12px;
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .product-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: var(--tg-theme-hint-color, #ddd);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
  }
  .product-info { padding: 8px 10px 10px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .product-name { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .product-price { font-size: 14px; font-weight: 700; color: var(--tg-theme-button-color, #0088cc); }
  .product-unavailable { font-size: 12px; color: var(--tg-theme-hint-color, #999); margin-top: auto; }

  .qty-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
  }
  .qty-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: var(--tg-theme-button-color, #0088cc);
    color: var(--tg-theme-button-text-color, #fff);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-num { font-size: 15px; font-weight: 700; min-width: 24px; text-align: center; }
  .add-btn {
    width: 100%;
    padding: 7px;
    border-radius: 8px;
    border: none;
    background: var(--tg-theme-button-color, #0088cc);
    color: var(--tg-theme-button-text-color, #fff);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: auto;
  }

  /* ── Cart screen ── */
  #cart-screen { padding: 16px; }
  #cart-screen h2 { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
  .cart-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--tg-theme-hint-color, #eee);
  }
  .cart-item-name { flex: 1; font-size: 14px; font-weight: 600; }
  .cart-item-price { font-size: 13px; color: var(--tg-theme-hint-color, #666); }
  .cart-total { font-size: 18px; font-weight: 700; margin: 16px 0; }

  /* ── Checkout screen ── */
  #checkout-screen { padding: 16px; }
  #checkout-screen h2 { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
  .form-group { margin-bottom: 14px; }
  label { font-size: 13px; color: var(--tg-theme-hint-color, #666); display: block; margin-bottom: 4px; }
  input[type="text"], input[type="tel"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--tg-theme-hint-color, #ccc);
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    color: var(--tg-theme-text-color, #000);
    font-size: 15px;
  }
  .toggle-row {
    display: flex;
    gap: 8px;
  }
  .toggle-btn {
    flex: 1;
    padding: 9px;
    border-radius: 10px;
    border: 1px solid var(--tg-theme-hint-color, #ccc);
    background: transparent;
    color: var(--tg-theme-text-color, #000);
    font-size: 14px;
    cursor: pointer;
  }
  .toggle-btn.active {
    background: var(--tg-theme-button-color, #0088cc);
    color: var(--tg-theme-button-text-color, #fff);
    border-color: transparent;
  }
  #address-group { display: none; }
</style>
</head>
<body>

<!-- ── Shop screen ── -->
<div id="shop-screen" class="screen active">
  <header>
    <h1 id="shop-title">Shop</h1>
    <div id="cart-badge">🛒 <span id="cart-count">0</span></div>
  </header>
  <div id="category-tabs"></div>
  <div id="product-grid"></div>
</div>

<!-- ── Cart screen ── -->
<div id="cart-screen" class="screen">
  <h2>Your Cart</h2>
  <div id="cart-items"></div>
  <div class="cart-total">Total: €<span id="cart-total">0.00</span></div>
</div>

<!-- ── Checkout screen ── -->
<div id="checkout-screen" class="screen">
  <h2>Checkout</h2>
  <div class="form-group">
    <label>Full name</label>
    <input type="text" id="input-name" placeholder="John Doe" />
  </div>
  <div class="form-group">
    <label>Phone number</label>
    <input type="tel" id="input-phone" placeholder="+1 234 567 890" />
  </div>
  <div class="form-group">
    <label>Delivery</label>
    <div class="toggle-row">
      <button class="toggle-btn active" id="btn-pickup" onclick="setDelivery('pickup')">🏪 Pickup</button>
      <button class="toggle-btn" id="btn-delivery" onclick="setDelivery('delivery')">🚚 Delivery</button>
    </div>
  </div>
  <div class="form-group" id="address-group">
    <label>Address</label>
    <input type="text" id="input-address" placeholder="123 Main St" />
  </div>
  <div class="form-group">
    <label>Payment</label>
    <div class="toggle-row">
      <button class="toggle-btn active" id="btn-inperson" onclick="setPayment('inperson')">💵 Cash</button>
      <button class="toggle-btn" id="btn-paypal" onclick="setPayment('paypal')">💳 PayPal</button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.enableClosingConfirmation();

// ── State ──
let catalog = null;
let cart = {};           // { productId: qty }
let productMap = {};     // { productId: product }
let currentCatId = null;
let currentScreen = "shop";
let deliveryType = "pickup";
let paymentType = "inperson";

// ── Load catalog ──
async function loadCatalog() {
  try {
    // Try to load from same directory (GitHub Pages)
    const res = await fetch("catalog.json");
    catalog = await res.json();
  } catch {
    catalog = { categories: [] };
  }
  // Build productMap
  for (const cat of catalog.categories) {
    for (const p of cat.products) {
      productMap[p.id] = { ...p, categoryId: cat.id };
    }
  }
  renderTabs();
  const firstCat = catalog.categories.find(c => c.products.some(p => p.available));
  if (firstCat) selectCategory(firstCat.id);
  document.getElementById("shop-title").textContent = tg.initDataUnsafe?.user?.first_name
    ? `Hi ${tg.initDataUnsafe.user.first_name} 👋`
    : "Shop";
}

// ── Category tabs ──
function renderTabs() {
  const el = document.getElementById("category-tabs");
  el.innerHTML = catalog.categories
    .map(c => `<button class="tab" data-id="${c.id}" onclick="selectCategory('${c.id}')">${c.name}</button>`)
    .join("");
}

function selectCategory(id) {
  currentCatId = id;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.id === id));
  renderProducts();
}

// ── Product grid ──
function renderProducts() {
  const cat = catalog.categories.find(c => c.id === currentCatId);
  const grid = document.getElementById("product-grid");
  if (!cat) { grid.innerHTML = ""; return; }

  grid.innerHTML = cat.products.map(p => {
    const qty = cart[p.id] || 0;
    const emoji = categoryEmoji(currentCatId);
    const imgHtml = p.image_url
      ? `<img class="product-img" src="${p.image_url}" alt="${p.name}" />`
      : `<div class="product-img">${emoji}</div>`;

    if (!p.available) {
      return `<div class="product-card">
        ${imgHtml}
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-unavailable">Out of stock</div>
        </div>
      </div>`;
    }

    const controls = qty === 0
      ? `<button class="add-btn" onclick="addToCart('${p.id}')">ADD</button>`
      : `<div class="qty-row">
           <button class="qty-btn" onclick="changeQty('${p.id}',-1)">−</button>
           <span class="qty-num">${qty}</span>
           <button class="qty-btn" onclick="changeQty('${p.id}',1)">+</button>
         </div>`;

    return `<div class="product-card" id="card-${p.id}">
      ${imgHtml}
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-price">€${p.price.toFixed(2)}</div>
        ${controls}
      </div>
    </div>`;
  }).join("");
}

function categoryEmoji(id) {
  const map = { devices: "⚡", disposables: "🔥", eliquids: "💧", accessories: "🔧" };
  return map[id] || "🛍";
}

// ── Cart logic ──
function addToCart(id) {
  cart[id] = 1;
  updateCart();
  renderProducts();
}

function changeQty(id, delta) {
  cart[id] = (cart[id] || 0) + delta;
  if (cart[id] <= 0) delete cart[id];
  updateCart();
  renderProducts();
}

function updateCart() {
  const total = cartTotal();
  const count = Object.values(cart).reduce((s, q) => s + q, 0);
  const badge = document.getElementById("cart-badge");
  const countEl = document.getElementById("cart-count");
  countEl.textContent = count;
  badge.style.display = count > 0 ? "block" : "none";

  if (count > 0) {
    tg.MainButton.setText(`🛒 View Cart — €${total.toFixed(2)}`);
    tg.MainButton.show();
    tg.MainButton.onClick(goToCart);
  } else {
    tg.MainButton.hide();
  }
}

function cartTotal() {
  return Object.entries(cart).reduce((sum, [id, qty]) => {
    return sum + (productMap[id]?.price || 0) * qty;
  }, 0);
}

// ── Navigation ──
function goToCart() {
  tg.MainButton.offClick(goToCart);
  showScreen("cart");
  renderCart();
  tg.BackButton.show();
  tg.BackButton.onClick(goToShop);
  tg.MainButton.setText(`Checkout — €${cartTotal().toFixed(2)}`);
  tg.MainButton.onClick(goToCheckout);
}

function goToShop() {
  tg.BackButton.offClick(goToShop);
  tg.BackButton.hide();
  showScreen("shop");
  updateCart();
}

function goToCheckout() {
  tg.MainButton.offClick(goToCheckout);
  showScreen("checkout");
  tg.BackButton.offClick(goToShop);
  tg.BackButton.onClick(goToCart);
  tg.MainButton.setText("Place Order");
  tg.MainButton.onClick(placeOrder);
}

function showScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(`${name}-screen`).classList.add("active");
  currentScreen = name;
}

// ── Cart render ──
function renderCart() {
  const el = document.getElementById("cart-items");
  el.innerHTML = Object.entries(cart).map(([id, qty]) => {
    const p = productMap[id];
    if (!p) return "";
    return `<div class="cart-item">
      <div class="cart-item-name">${p.name}</div>
      <div class="qty-row" style="gap:8px">
        <button class="qty-btn" onclick="changeQty('${id}',-1);renderCart();updateCartTotal()">−</button>
        <span class="qty-num">${qty}</span>
        <button class="qty-btn" onclick="changeQty('${id}',1);renderCart();updateCartTotal()">+</button>
      </div>
      <div class="cart-item-price">€${(p.price * qty).toFixed(2)}</div>
    </div>`;
  }).join("");
  updateCartTotal();
}

function updateCartTotal() {
  document.getElementById("cart-total").textContent = cartTotal().toFixed(2);
  if (Object.keys(cart).length === 0) goToShop();
}

// ── Delivery/Payment toggles ──
function setDelivery(type) {
  deliveryType = type;
  document.getElementById("btn-pickup").classList.toggle("active", type === "pickup");
  document.getElementById("btn-delivery").classList.toggle("active", type === "delivery");
  document.getElementById("address-group").style.display = type === "delivery" ? "block" : "none";
}

function setPayment(type) {
  paymentType = type;
  document.getElementById("btn-inperson").classList.toggle("active", type === "inperson");
  document.getElementById("btn-paypal").classList.toggle("active", type === "paypal");
}

// ── Submit order ──
function placeOrder() {
  const name = document.getElementById("input-name").value.trim();
  const phone = document.getElementById("input-phone").value.trim();
  const address = document.getElementById("input-address").value.trim();

  if (!name) { tg.showAlert("Please enter your name."); return; }
  if (!phone) { tg.showAlert("Please enter your phone number."); return; }
  if (deliveryType === "delivery" && !address) { tg.showAlert("Please enter your delivery address."); return; }

  const items = Object.entries(cart).map(([id, qty]) => ({
    id,
    category_id: productMap[id]?.categoryId || "",
    name: productMap[id]?.name || id,
    qty,
    price: productMap[id]?.price || 0,
  }));

  const order = { name, phone, delivery_type: deliveryType, address, payment: paymentType, items };

  tg.MainButton.showProgress();
  tg.sendData(JSON.stringify(order));
}

// ── Cart badge tap ──
document.getElementById("cart-badge").addEventListener("click", goToCart);

// ── Init ──
loadCatalog();
</script>
</body>
</html>
