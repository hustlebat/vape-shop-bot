<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Boutique</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000);
    padding-bottom: 80px;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  /* ── Header ── */
  header {
    position: sticky;
    top: 0;
    background: var(--tg-theme-bg-color, #fff);
    border-bottom: 1px solid var(--tg-theme-hint-color, #ccc);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  #cart-badge {
    background: var(--tg-theme-button-color, #0088cc);
    color: var(--tg-theme-button-text-color, #fff);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: none;
  }

  /* ── Category tabs ── */
  #category-tabs {
    display: flex;
    overflow-x: auto;
    gap: 8px;
    padding: 10px 16px;
    scrollbar-width: none;
  }
  #category-tabs::-webkit-scrollbar { display: none; }
  .tab {
    white-space: nowrap;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--tg-theme-hint-color, #ccc);
    background: transparent;
    color: var(--tg-theme-text-color, #000);
    font-size: 14px;
    cursor: pointer;
  }
  .tab.active {
    background: var(--tg-theme-button-color, #0088cc);
    color: var(--tg-theme-button-text-color, #fff);
    border-color: transparent;
  }

  /* ── Product grid ── */
  #product-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 12px 16px;
  }
  .product-card {
    border-radius: 12px;
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .product-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: var(--tg-theme-hint-color, #ddd);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
  }
  .product-info { padding: 8px 10px 10px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .product-name { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .product-price { font-size: 14px; font-weight: 700; color: var(--tg-theme-button-color, #0088cc); }
  .product-unavailable { font-size: 12px; color: var(--tg-theme-hint-color, #999); margin-top: auto; }
  .mix-badge { font-size: 11px; color: var(--tg-theme-hint-color, #888); margin-top: 2px; }

  .qty-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
  }
  .qty-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: var(--tg-theme-button-color, #0088cc);
    color: var(--tg-theme-button-text-color, #fff);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-num { font-size: 15px; font-weight: 700; min-width: 24px; text-align: center; }
  .add-btn {
    width: 100%;
    padding: 7px;
    border-radius: 8px;
    border: none;
    background: var(--tg-theme-button-color, #0088cc);
    color: var(--tg-theme-button-text-color, #fff);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: auto;
  }

  /* ── Mix screen ── */
  #mix-screen { padding: 16px; }
  #mix-screen h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  #mix-product-price { font-size: 18px; font-weight: 700; color: var(--tg-theme-button-color, #0088cc); margin-bottom: 12px; }
  #mix-subtitle { font-size: 15px; margin-bottom: 16px; }
  #mix-buttons { display: flex; flex-direction: column; gap: 10px; }
  .mix-btn {
    display: flex;
    flex-direction: column;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--tg-theme-hint-color, #ccc);
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    cursor: pointer;
    text-align: left;
    gap: 4px;
  }
  .mix-btn.selected { border-color: var(--tg-theme-button-color, #0088cc); }
  .mix-btn-title { font-size: 15px; font-weight: 700; color: var(--tg-theme-text-color, #000); }
  .mix-btn-flavors { font-size: 12px; color: var(--tg-theme-hint-color, #666); }

  /* ── Cart screen ── */
  #cart-screen { padding: 16px; }
  #cart-screen h2 { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
  .cart-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--tg-theme-hint-color, #eee);
  }
  .cart-item-name { flex: 1; font-size: 14px; font-weight: 600; }
  .cart-item-price { font-size: 13px; color: var(--tg-theme-hint-color, #666); }
  .cart-total { font-size: 18px; font-weight: 700; margin: 16px 0; }

  /* ── Checkout screen ── */
  #checkout-screen { padding: 16px; }
  #checkout-screen h2 { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
  .form-group { margin-bottom: 14px; }
  label { font-size: 13px; color: var(--tg-theme-hint-color, #666); display: block; margin-bottom: 4px; }
  input[type="text"], input[type="tel"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--tg-theme-hint-color, #ccc);
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    color: var(--tg-theme-text-color, #000);
    font-size: 15px;
  }
  .toggle-row { display: flex; gap: 8px; }
  .toggle-btn {
    flex: 1;
    padding: 9px;
    border-radius: 10px;
    border: 1px solid var(--tg-theme-hint-color, #ccc);
    background: transparent;
    color: var(--tg-theme-text-color, #000);
    font-size: 14px;
    cursor: pointer;
  }
  .toggle-btn.active {
    background: var(--tg-theme-button-color, #0088cc);
    color: var(--tg-theme-button-text-color, #fff);
    border-color: transparent;
  }
  #address-group { display: none; }
</style>
</head>
<body>

<!-- ── Boutique ── -->
<div id="shop-screen" class="screen active">
  <header>
    <h1 id="shop-title">Boutique</h1>
    <div id="cart-badge">🛒 <span id="cart-count">0</span></div>
  </header>
  <div id="category-tabs"></div>
  <div id="product-grid"></div>
</div>

<!-- ── Sélection de saveur ── -->
<div id="mix-screen" class="screen">
  <h2 id="mix-product-name"></h2>
  <div id="mix-product-price"></div>
  <div id="mix-subtitle">🍬 Sélectionnez votre saveur :</div>
  <div id="mix-buttons"></div>
</div>

<!-- ── Panier ── -->
<div id="cart-screen" class="screen">
  <h2>Votre panier</h2>
  <div id="cart-items"></div>
  <div class="cart-total">Total : €<span id="cart-total">0.00</span></div>
</div>

<!-- ── Commander ── -->
<div id="checkout-screen" class="screen">
  <h2>Commander</h2>
  <div class="form-group">
    <label>Nom complet</label>
    <input type="text" id="input-name" placeholder="Jean Dupont" />
  </div>
  <div class="form-group">
    <label>Numéro de téléphone</label>
    <input type="tel" id="input-phone" placeholder="+33 6 00 00 00 00" />
  </div>
  <div class="form-group">
    <label>Livraison</label>
    <div class="toggle-row">
      <button class="toggle-btn active" id="btn-pickup" onclick="setDelivery('pickup')">🏪 Retrait</button>
      <button class="toggle-btn" id="btn-delivery" onclick="setDelivery('delivery')">🚚 Livraison</button>
    </div>
  </div>
  <div class="form-group" id="address-group">
    <label>Adresse</label>
    <input type="text" id="input-address" placeholder="123 rue de la Paix" />
  </div>
  <div class="form-group">
    <label>Paiement</label>
    <div class="toggle-row">
      <button class="toggle-btn active" id="btn-inperson" onclick="setPayment('inperson')">💵 Espèces</button>
      <button class="toggle-btn" id="btn-paypal" onclick="setPayment('paypal')">💳 PayPal</button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.enableClosingConfirmation();

const NUM_EMOJI = ["1️⃣","2️⃣","3️⃣","4️⃣","5️⃣","6️⃣","7️⃣","8️⃣","9️⃣","🔟","1️⃣1️⃣","1️⃣2️⃣"];

let catalog = null;
let cart = {};
let productMap = {};
let currentCatId = null;
let currentMixProductId = null;
let deliveryType = "pickup";
let paymentType = "inperson";

async function loadCatalog() {
  try {
    const res = await fetch("catalog.json?v=" + Date.now());
    catalog = await res.json();
  } catch {
    catalog = { categories: [] };
  }
  for (const cat of catalog.categories) {
    for (const p of cat.products) {
      productMap[p.id] = { ...p, categoryId: cat.id };
    }
  }
  renderTabs();
  const firstCat = catalog.categories.find(c => c.products.some(p => p.available));
  if (firstCat) selectCategory(firstCat.id);
  document.getElementById("shop-title").textContent = tg.initDataUnsafe?.user?.first_name
    ? `Bonjour ${tg.initDataUnsafe.user.first_name} 👋`
    : "Boutique";
}

function renderTabs() {
  document.getElementById("category-tabs").innerHTML = catalog.categories
    .map(c => `<button class="tab" data-id="${c.id}" onclick="selectCategory('${c.id}')">${c.name}</button>`)
    .join("");
}

function selectCategory(id) {
  currentCatId = id;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.id === id));
  renderProducts();
}

function renderProducts() {
  const cat = catalog.categories.find(c => c.id === currentCatId);
  const grid = document.getElementById("product-grid");
  if (!cat) { grid.innerHTML = ""; return; }

  grid.innerHTML = cat.products.map(p => {
    const emoji = { devices:"⚡", disposables:"🔥", eliquids:"💧", accessories:"🔧" }[currentCatId] || "🛍";
    const imgHtml = p.image_url
      ? `<img class="product-img" src="${p.image_url}" alt="${p.name}" />`
      : `<div class="product-img">${emoji}</div>`;

    if (!p.available) {
      return `<div class="product-card">${imgHtml}
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-unavailable">Rupture de stock</div>
        </div></div>`;
    }

    if (p.mixes && p.mixes.length > 0) {
      const inCart = Object.keys(cart).filter(k => k.startsWith(p.id + "-mix-")).reduce((s,k) => s + cart[k], 0);
      const badge = inCart > 0 ? `<div class="mix-badge">🛒 ${inCart} dans le panier</div>` : "";
      return `<div class="product-card">${imgHtml}
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-price">€${p.price.toFixed(2)}</div>
          ${badge}
          <button class="add-btn" onclick="showMixScreen('${p.id}')">🍬 Choisir</button>
        </div></div>`;
    }

    const qty = cart[p.id] || 0;
    const controls = qty === 0
      ? `<button class="add-btn" onclick="addToCart('${p.id}')">AJOUTER</button>`
      : `<div class="qty-row">
           <button class="qty-btn" onclick="changeQty('${p.id}',-1)">−</button>
           <span class="qty-num">${qty}</span>
           <button class="qty-btn" onclick="changeQty('${p.id}',1)">+</button>
         </div>`;
    return `<div class="product-card" id="card-${p.id}">${imgHtml}
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-price">€${p.price.toFixed(2)}</div>
        ${controls}
      </div></div>`;
  }).join("");
}

function showMixScreen(productId) {
  currentMixProductId = productId;
  const p = productMap[productId];
  document.getElementById("mix-product-name").textContent = p.name;
  document.getElementById("mix-product-price").textContent = `€${p.price.toFixed(2)}`;

  document.getElementById("mix-buttons").innerHTML = p.mixes.map((mix, i) => {
    const itemId = productId + "-mix-" + mix.id;
    const qty = cart[itemId] || 0;
    const qtyBadge = qty > 0
      ? ` <span style="float:right;background:var(--tg-theme-button-color,#0088cc);color:#fff;border-radius:12px;padding:1px 8px;font-size:12px">×${qty}</span>`
      : "";
    return `<button class="mix-btn${qty > 0 ? " selected" : ""}" onclick="selectMix('${productId}',${mix.id})">
      <div class="mix-btn-title">${NUM_EMOJI[i] || (mix.id + ".")} Mix #${mix.id}${qtyBadge}</div>
      <div class="mix-btn-flavors">${mix.flavors.join(" · ")}</div>
    </button>`;
  }).join("");

  showScreen("mix");
  tg.BackButton.show();
  tg.BackButton.onClick(backFromMix);
  updateMixMainButton();
}

function updateMixMainButton() {
  const count = Object.values(cart).reduce((s, q) => s + q, 0);
  tg.MainButton.offClick(goToCart);
  if (count > 0) {
    tg.MainButton.setText(`🛒 Voir le panier — €${cartTotal().toFixed(2)}`);
    tg.MainButton.show();
    tg.MainButton.onClick(goToCart);
  } else {
    tg.MainButton.hide();
  }
}

function selectMix(productId, mixId) {
  const itemId = productId + "-mix-" + mixId;
  cart[itemId] = (cart[itemId] || 0) + 1;
  showMixScreen(productId);
}

function backFromMix() {
  tg.BackButton.offClick(backFromMix);
  tg.BackButton.hide();
  showScreen("shop");
  renderProducts();
  updateCart();
}

function addToCart(id) {
  cart[id] = 1;
  updateCart();
  renderProducts();
}

function changeQty(id, delta) {
  cart[id] = (cart[id] || 0) + delta;
  if (cart[id] <= 0) delete cart[id];
  updateCart();
  renderProducts();
}

function updateCart() {
  const count = Object.values(cart).reduce((s, q) => s + q, 0);
  document.getElementById("cart-count").textContent = count;
  document.getElementById("cart-badge").style.display = count > 0 ? "block" : "none";
  tg.MainButton.offClick(goToCart);
  if (count > 0) {
    tg.MainButton.setText(`🛒 Voir le panier — €${cartTotal().toFixed(2)}`);
    tg.MainButton.show();
    tg.MainButton.onClick(goToCart);
  } else {
    tg.MainButton.hide();
  }
}

function cartTotal() {
  return Object.entries(cart).reduce((sum, [id, qty]) => {
    const baseId = id.includes("-mix-") ? id.replace(/-mix-\d+$/, "") : id;
    return sum + (productMap[baseId]?.price || 0) * qty;
  }, 0);
}

function goToCart() {
  tg.MainButton.offClick(goToCart);
  showScreen("cart");
  renderCart();
  tg.BackButton.show();
  tg.BackButton.onClick(goToShop);
  tg.MainButton.setText(`Commander — €${cartTotal().toFixed(2)}`);
  tg.MainButton.onClick(goToCheckout);
}

function goToShop() {
  tg.BackButton.offClick(goToShop);
  tg.BackButton.hide();
  showScreen("shop");
  updateCart();
}

function goToCheckout() {
  tg.MainButton.offClick(goToCheckout);
  showScreen("checkout");
  tg.BackButton.offClick(goToShop);
  tg.BackButton.onClick(goToCart);
  tg.MainButton.setText("Passer la commande");
  tg.MainButton.onClick(placeOrder);
}

function showScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(name + "-screen").classList.add("active");
}

function renderCart() {
  document.getElementById("cart-items").innerHTML = Object.entries(cart).map(([id, qty]) => {
    const baseId = id.includes("-mix-") ? id.replace(/-mix-\d+$/, "") : id;
    const p = productMap[baseId];
    if (!p) return "";
    const label = id.includes("-mix-") ? `${p.name} — Mix #${id.split("-mix-")[1]}` : p.name;
    return `<div class="cart-item">
      <div class="cart-item-name">${label}</div>
      <div class="qty-row" style="gap:8px">
        <button class="qty-btn" onclick="changeCartQty('${id}',-1)">−</button>
        <span class="qty-num">${qty}</span>
        <button class="qty-btn" onclick="changeCartQty('${id}',1)">+</button>
      </div>
      <div class="cart-item-price">€${(p.price * qty).toFixed(2)}</div>
    </div>`;
  }).join("");
  document.getElementById("cart-total").textContent = cartTotal().toFixed(2);
}

function changeCartQty(id, delta) {
  cart[id] = (cart[id] || 0) + delta;
  if (cart[id] <= 0) delete cart[id];
  if (Object.keys(cart).length === 0) { goToShop(); return; }
  renderCart();
  tg.MainButton.setText(`Commander — €${cartTotal().toFixed(2)}`);
}

function setDelivery(type) {
  deliveryType = type;
  document.getElementById("btn-pickup").classList.toggle("active", type === "pickup");
  document.getElementById("btn-delivery").classList.toggle("active", type === "delivery");
  document.getElementById("address-group").style.display = type === "delivery" ? "block" : "none";
}

function setPayment(type) {
  paymentType = type;
  document.getElementById("btn-inperson").classList.toggle("active", type === "inperson");
  document.getElementById("btn-paypal").classList.toggle("active", type === "paypal");
}

function placeOrder() {
  const name = document.getElementById("input-name").value.trim();
  const phone = document.getElementById("input-phone").value.trim();
  const address = document.getElementById("input-address").value.trim();
  if (!name) { tg.showAlert("Veuillez entrer votre nom."); return; }
  if (!phone) { tg.showAlert("Veuillez entrer votre numéro de téléphone."); return; }
  if (deliveryType === "delivery" && !address) { tg.showAlert("Veuillez entrer votre adresse de livraison."); return; }

  const items = Object.entries(cart).map(([id, qty]) => {
    const baseId = id.includes("-mix-") ? id.replace(/-mix-\d+$/, "") : id;
    const p = productMap[baseId];
    const label = id.includes("-mix-") ? `${p?.name} — Mix #${id.split("-mix-")[1]}` : (p?.name || id);
    return { id, category_id: p?.categoryId || "", name: label, qty, price: p?.price || 0 };
  });

  tg.MainButton.showProgress();
  tg.sendData(JSON.stringify({ name, phone, delivery_type: deliveryType, address, payment: paymentType, items }));
}

document.getElementById("cart-badge").addEventListener("click", goToCart);
loadCatalog();
</script>
</body>
</html>
